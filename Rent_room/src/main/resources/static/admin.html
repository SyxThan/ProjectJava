<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản trị hệ thống - Phòng trọ 24/7</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/admin.css">

    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

    <script src="https://unpkg.com/feather-icons"></script>
</head>

<body class="bg-gray-100">
<!-- Navbar -->
<header id="navbar-container"></header>

<!-- MAIN CONTENT -->
<div class="container mx-auto px-4 py-10">

    <h1 class="text-3xl font-bold mb-6 text-gray-800">
        Quản lý bài đăng chờ duyệt
    </h1>

    <!-- CHỈ HIỂN THỊ NẾU KHÔNG PHẢI ADMIN -->
    <div id="not-admin" class="hidden p-6 bg-red-100 text-red-700 rounded-lg mb-10">
        <p class="text-lg font-semibold">Bạn không có quyền truy cập trang này!</p>
    </div>

    <!-- LIST BÀI ĐĂNG -->
    <div id="admin-content" class="hidden">
        <div id="pending-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

        <!-- Loading -->
        <div id="loading" class="text-center py-10 hidden">
            <div class="animate-spin h-10 w-10 border-4 border-blue-600 border-t-transparent rounded-full mx-auto"></div>
            <p class="mt-3 text-gray-600">Đang tải...</p>
        </div>
    </div>
</div>

<div id="detail-modal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modal-title"></h2>
            <span class="close-modal" id="close-modal">&times;</span>
        </div>
        <div class="modal-body" id="modal-body">
            <!-- Thông tin bài đăng sẽ inject bằng JS -->
        </div>
        <div class="modal-actions" id="modal-actions">
            <!-- Nút duyệt/từ chối/xóa sẽ inject bằng JS -->
        </div>
    </div>
</div>

<script src="js/navbar.js"></script>
<script src="js/admin.js"></script>

<script>
    if (typeof feather !== "undefined") feather.replace();
</script>
</body>
</html>
