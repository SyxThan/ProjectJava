<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết phòng trọ - Phòng Trọ 24/7</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Be Vietnam Pro', sans-serif;
        }
        .room-gallery {
            scrollbar-width: thin;
            scrollbar-color: #3b82f6 #f1f1f1;
        }
        .room-gallery::-webkit-scrollbar {
            height: 6px;
        }
        .room-gallery::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        .room-gallery::-webkit-scrollbar-thumb {
            background-color: #3b82f6;
            border-radius: 6px;
        }
        .amenity-icon {
            width: 24px;
            height: 24px;
            stroke-width: 2;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Header - Navbar will be rendered by navbar.js -->
    <header class="bg-white shadow-sm sticky top-0 z-50" id="navbar-container">
        <!-- Navbar content will be injected here -->
    </header>

    <!-- Main Content -->
    <div class="container mx-auto px-4 py-8">
        <div class="flex flex-col lg:flex-row gap-8">
            <!-- Room Details - Content will be loaded by JavaScript -->
            <div class="lg:w-2/3" id="roomDetails">
                <!-- Loading state -->
                <div class="text-center py-12">
                    <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
                    <p class="mt-4 text-gray-600">Đang tải thông tin bài đăng...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Initialize feather icons
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof feather !== 'undefined') {
                feather.replace();
            }
            
            // Mobile menu toggle
            const mobileMenuButton = document.getElementById('mobile-menu-button');
            if (mobileMenuButton) {
                mobileMenuButton.addEventListener('click', function() {
                    const mobileMenu = document.getElementById('mobile-menu');
                    if (mobileMenu) {
                        mobileMenu.classList.toggle('hidden');
                    }
                });
            }
        });
    </script>
    <script src="js/api.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/detail.js"></script>
</body>
</html>
